name: Validate Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.terraform-version'
      - '.tflint.hcl'
      - 'scripts/lib/terraform-policy.mjs'
      - 'scripts/terraform-policy-check.mjs'
      - 'scripts/tests/terraform-policy.test.mjs'
      - '.github/workflows/terraform-check.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.terraform-version'
      - '.tflint.hcl'
      - 'scripts/lib/terraform-policy.mjs'
      - 'scripts/terraform-policy-check.mjs'
      - 'scripts/tests/terraform-policy.test.mjs'
      - '.github/workflows/terraform-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Run repository policy checks
        run: |
          node scripts/terraform-policy-check.mjs
          node --test scripts/tests/terraform-policy.test.mjs

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --chdir=infra --format=compact

      - name: Initialize and validate environment roots
        run: |
          for root in infra/live/nonprod/us-east-1 infra/live/prod/us-east-1; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done

      - name: Validate and test reusable modules
        run: |
          for module in infra/modules/*; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done
          terraform -chdir=infra/modules/static-site test

      - name: Install pinned Checkov
        run: pip install --disable-pip-version-check checkov==3.3.16

      - name: Run Terraform security checks
        run: >-
          checkov --directory infra --framework terraform --compact --quiet
          --skip-path 'infra/modules/.*/tests'

      - name: Summarize validation failure
        if: ${{ failure() }}
        run: |
          echo '## Terraform validation failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Formatting, provider locks, environment validation, TFLint, repository guardrails, and Checkov must pass before infrastructure changes merge.' >> "$GITHUB_STEP_SUMMARY"
