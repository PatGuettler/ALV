name: Test Terraform modules

on:
  pull_request:
    paths:
      - 'infra/modules/**'
      - '.terraform-version'
      - '.github/workflows/terraform-module-tests.yml'
  push:
    branches: [main]
    paths:
      - 'infra/modules/**'
      - '.terraform-version'
      - '.github/workflows/terraform-module-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-module-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Terraform module mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Run every module mock test
        shell: bash
        run: |
          set -euo pipefail
          tested=0
          for module in infra/modules/*; do
            if compgen -G "$module/tests/*.tftest.hcl" > /dev/null; then
              echo "Testing $module"
              terraform -chdir="$module" init -backend=false -input=false
              terraform -chdir="$module" test
              tested=$((tested + 1))
            fi
          done
          if [ "$tested" -eq 0 ]; then
            echo 'No Terraform module tests were discovered.' >&2
            exit 1
          fi
          echo "Tested $tested Terraform modules."
