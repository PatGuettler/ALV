name: Deploy staging to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Refresh events calendar from GHL
        continue-on-error: true
        env:
          GHL_PRIVATE_INTEGRATION_TOKEN: ${{ secrets.GHL_PRIVATE_INTEGRATION_TOKEN }}
        run: |
          if [ -z "$GHL_PRIVATE_INTEGRATION_TOKEN" ]; then
            echo 'Skipping GHL events sync; GHL_PRIVATE_INTEGRATION_TOKEN is not set.'
            exit 0
          fi
          node scripts/sync-events-calendar.mjs

      - name: Validate source
        run: |
          npm run format:check
          npm run check
          npm test

      - name: Build staging site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ENV: staging
          PUBLIC_EVENTS_FEED_URL: ${{ vars.PUBLIC_EVENTS_FEED_URL }}
        run: npm run build

      - name: Validate build
        env:
          CHECK_BUILD: '1'
        run: npm run test:site

      - name: Audit staging SEO output
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ENV: staging
        run: node scripts/seo-audit.mjs

      - name: Run browser smoke test
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/browser-smoke.mjs

      - name: Run automated accessibility scans
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/accessibility-scan.mjs

      - name: Upload accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessibility-report
          path: artifacts/accessibility/axe-report.json

      - name: Enforce Lighthouse performance budget
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/performance-budget.mjs

      - name: Upload Lighthouse performance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-performance-report
          path: artifacts/performance/lighthouse-budget-report.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
